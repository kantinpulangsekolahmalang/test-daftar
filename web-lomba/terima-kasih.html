<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Berhasil</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(27, 94, 32, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border-top: 7px solid #25d366;
        }
        .icon {
            width: 90px; height: 90px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 22px auto;
            font-size: 45px;
            border: 3px solid #25d366;
        }
        h1 { color: #1b5e20; font-size: 1.9em; margin-bottom: 12px; }
        p { color: #555; font-size: 1.05em; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white; text-decoration: none;
            padding: 14px 30px; border-radius: 50px;
            font-weight: 700; font-size: 1.05em;
            box-shadow: 0 6px 18px rgba(37,211,102,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37,211,102,0.45); }
        .email-note {
            margin-top: 22px;
            font-size: 0.88em;
            color: #777;
            background: #f1f8e9;
            padding: 12px;
            border-radius: 10px;
            border: 1px dashed #c8e6c9;
        }
        .email-note strong { color: #1b5e20; }
        @media (max-width: 480px) {
            .box { padding: 30px 22px; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✅</div>
        <h1>Pendaftaran Berhasil!</h1>
        <p>Terima kasih telah mendaftarkan tim Anda. Data telah dikirim ke panitia lomba dan akan segera diverifikasi.</p>
        <a href="index.html" class="btn">⬅ Kembali ke Halaman Utama</a>
        <div class="email-note">
            Notifikasi telah dikirim ke email panitia:<br><strong>xf4isalhere@gmail.com</strong>
        </div>
    </div>
</body>
</html>
